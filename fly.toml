# Fly.io — backend (API + IA + webhook WhatsApp) da Mayra AI Sales
# App: mayra-api  |  Região: gru (São Paulo, perto do Neon sa-east-1)

app = "mayra-api"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Roda migrations + seed antes de trocar as máquinas (usa DATABASE_URL dos secrets)
  release_command = "npm run migrate && npm run seed --workspace server"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  UPLOAD_DIR = "/data/uploads"
  RLS_ENFORCE = "true"
  WHATSAPP_PROVIDER = "zapi"
  CLAUDE_MODEL = "claude-sonnet-4-6"
  STORE_NAME = "Maryland"
  STT_PROVIDER = "openai"
  STT_BASE_URL = "https://api.groq.com/openai/v1"
  STT_MODEL = "whisper-large-v3"
  STT_LANGUAGE = "pt"
  MEDIA_LEGACY_FALLBACK = "true"
  HUMAN_TAKEOVER_MINUTES = "30"
  S3_REGION = "auto"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "mayra_uploads"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
